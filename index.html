<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div class="scoreboard-column">
                <h3>HOME</h3>
                <div class="score-box">
                    <p class = "score" id="home-score">0</p>
                </div>
                <div class="buttons-group">
                    <button onclick="add1h()">+1</button>
                    <button onclick="add2h()">+2</button>
                    <button onclick="add3h()">+3</button>
                </div>
            </div>
            <div class="scoreboard-column">
                <h3>AWAY</h3>
                <div class="score-box">
                    <p class = "score" id="guest-score">0</p>
                </div>
                <div class="buttons-group">
                    <button onclick="add1g()">+1</button>
                    <button onclick="add2g()">+2</button>
                    <button onclick="add3g()">+3</button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
